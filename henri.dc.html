  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2f231123-7147-4677-a6e0-18bf43f35756\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"511a1cdc-e034-4533-b1dd-0cf9bec48f69\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"595bc4df-f82e-4b12-9a3b-7ed0ebc8d18b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"470fa6c4-743c-4a83-b852-ae3d826842c3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"9cc88e13-a87e-41a5-85aa-8c4314995d0a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"d314a135-21f4-4f79-a162-a2836a860f1f\"><\u002Fscript>\n<style>\nbody { margin:0; background:#FAF9F6; color:#17150F; font-family:'Instrument Sans',sans-serif; -webkit-font-smoothing:antialiased; }\na { color:#FF3D00; text-decoration:none; }\na:hover { color:#C42E00; }\n::selection { background:#FF3D00; color:#fff; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh; display:flex; flex-direction:column\">\n  <header style=\"display:flex; align-items:center; justify-content:space-between; padding:22px 48px; background:#17150F\">\n    <a href=\"index.html\" style=\"font-family:Arial,sans-serif; font-weight:500; font-size:22px; letter-spacing:0.01em; color:#fff\">Grégoire TAGOT&nbsp; &nbsp;|&nbsp; &nbsp;applications<\u002Fa>\n    <nav style=\"display:flex; gap:28px; font-size:14px\">\n      <a href=\"https://tagot.notaires.fr\" style=\"color:#fff; font-weight:700\">Notaire<\u002Fa>\n      <a href=\"index.html#apps\" style=\"color:#fff\">← Toutes les applications<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"padding: 100px 48px 72px; max-width: 1100px; display: flex; gap: 48px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; width: 1322px; height: 588px\">\n  <div style=\"flex:1 1 480px\">\n    <div style=\"font-family:ui-monospace,monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#FF3D00; margin-bottom:24px\">02 — Dossiers &amp; tâches<\u002Fdiv>\n    <h1 style=\"margin:0\"><img src=\"e1c4e933-0451-4980-a716-a1812b22fe16\" alt=\"Henri\" style=\"height:180px; display:block; margin-left:-8px\"><\u002Fh1>\n    <p style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:clamp(26px,3.2vw,38px); line-height:1.25; max-width:760px; margin:28px 0 20px; text-wrap:balance\">Chaque matin, ce qui presse, ce qui doit être fait — le reste attend le lendemain.<\u002Fp>\n    <p style=\"font-size:19px; line-height:1.6; color:#6A665C; max-width:680px; margin:0 0 36px; text-wrap:pretty\">Votre logiciel de rédaction sait faire un acte. Il ne sait pas suivre tout ce qui doit arriver avant : l'état hypothécaire demandé, le certificat d'urbanisme attendu, le RIB réclamé, le diagnostic à vérifier. C'est exactement ce que fait Henri — la liste des choses à faire et à recevoir, dossier par dossier, jour après jour.<br><\u002Fp>\n    <a href=\"https://henri.tagot.fr\" style=\"display:inline-block; background:#FF3D00; color:#fff; padding:14px 28px; font-size:15px; font-weight:500\" style-hover=\"background:#C42E00; color:#fff\">Ouvrir henri.tagot.fr<\u002Fa>\n  <\u002Fdiv>\n  <figure style=\"margin:0; flex:0 0 auto\">\n    <div style=\"width:270px; aspect-ratio:920/2000; border:1px solid #E8E5DE\"><image-slot id=\"henri-3\" shape=\"rounded\" radius=\"12\" fit=\"cover\" src=\"337096e3-885d-4983-8656-703df9cbf225\" placeholder=\"Capture — notification sur téléphone\"><\u002Fimage-slot><\u002Fdiv>\n    \n  <\u002Ffigure>\n  <\u002Fsection>\n\n  <section style=\"padding:0 48px 72px\">\n    <div style=\"font-family:ui-monospace,monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A5A093; margin-bottom:20px\">Ce que fait l'outil<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:1px; background:#E8E5DE; border:1px solid #E8E5DE; max-width:1400px\">\n      <div style=\"background:#fff; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Un dossier est un conteneur de tâches hiérarchisées<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Trois à quatre niveaux de profondeur, pas davantage — assez pour éclater « obtenir les pièces de copropriété » en ses six sous-demandes réelles, trop peu pour construire une usine à gaz dont personne ne verra jamais le fond.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Une navigation en colonnes, inspirée du Finder<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Dossiers, tâches, sous-tâches, détails : chaque clic ouvre la colonne suivante, sur la même vue. Aucune fenêtre modale ne s'interpose. Vous voyez d'où vous venez pendant que vous regardez où vous êtes.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Le clavier avant la souris<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\"><kbd style=\"font-family:ui-monospace,monospace; background:#F1EFE9; padding:1px 6px; border-radius:3px; font-size:13px\">N<\u002Fkbd> crée une tâche au niveau courant, <kbd style=\"font-family:ui-monospace,monospace; background:#F1EFE9; padding:1px 6px; border-radius:3px; font-size:13px\">Maj+N<\u002Fkbd> une sous-tâche, <kbd style=\"font-family:ui-monospace,monospace; background:#F1EFE9; padding:1px 6px; border-radius:3px; font-size:13px\">I<\u002Fkbd> ouvre le panneau de détail. On peut vider sa tête d'une réunion de dossier sans lâcher le clavier.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Quatre statuts, pas un de plus<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Créé, demande envoyée, pièce reçue, traité. Le statut « relance » a été délibérément supprimé : il transformait chaque tâche en historique et ralentissait la lecture. C'est un choix, pas un manque.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Une vue « Ma journée » que vous composez<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Vous décidez ce qui y entre. Mais l'outil vous suggère les candidats : les tâches sans activité depuis sept jours, celles dont l'échéance approche. Vous ajoutez d'un +, vous retirez d'un − dès que ça avance.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Des dossiers qui s'exportent et s'importent<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Vos trames de vérification — les pièces d'une vente d'appartement, d'une succession, d'un prêt — se préparent une fois et s'importent comme modèle à chaque nouveau dossier. Le savoir-faire de l'étude cesse d'être dans la tête d'une personne.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Utilisable au téléphone, même en déplacement<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Sur mobile, l'affichage bascule sur une colonne unique et l'on navigue au glissement du doigt. Le dossier vous suit chez le client, à l'audience, dans le train.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection><section style=\"padding:0 48px 72px\">\n    <figure style=\"margin:0; max-width:1400px\">\n      <div style=\"aspect-ratio:1915/1150; border:1px solid #E8E5DE\"><image-slot id=\"henri-1\" shape=\"rounded\" radius=\"4\" fit=\"cover\" src=\"c12309e5-3425-4c1f-95c7-5addc9a7ba9e\" placeholder=\"Capture d'écran — navigation en colonnes\"><\u002Fimage-slot><\u002Fdiv>\n      <figcaption style=\"font-size:13px; color:#A5A093; margin-top:8px\">La navigation en colonnes : dossiers, tâches, sous-tâches, et le panneau de détail à droite.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  \n\n  <section style=\"padding:0 48px 72px\">\n    <div style=\"font-family:ui-monospace,monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A5A093; margin-bottom:8px\">Fonctionnalités<\u002Fdiv>\n    <div style=\"max-width:1100px\">\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">A<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Structure<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Trois niveaux :<\u002Fstrong> dossiers → tâches → sous-tâches. Un dossier = un client ou une affaire.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Navigation colonne par colonne,<\u002Fstrong> à la souris ou aux flèches ← →, avec panneau de détail à droite : statut, échéance, commentaires, historique.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Recherche de dossier<\u002Fstrong> en bas de la première colonne, filtrage instantané.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Mini-récap d'avancement<\u002Fstrong> par dossier, et tri des dossiers selon le travail qui reste à faire.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">B<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Statuts<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:8px\"><span style=\"display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #E8E5DE; border-radius:99px; padding:5px 12px; font-size:14px; color:#17150F\"><span style=\"width:9px; height:9px; border-radius:50%; background:#9CA3AF\"><\u002Fspan>Créée<\u002Fspan><span style=\"color:#A5A093\">→<\u002Fspan><span style=\"display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #E8E5DE; border-radius:99px; padding:5px 12px; font-size:14px; color:#17150F\"><span style=\"width:9px; height:9px; border-radius:50%; background:#F59E0B\"><\u002Fspan>Demandé<\u002Fspan><span style=\"color:#A5A093\">→<\u002Fspan><span style=\"display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #E8E5DE; border-radius:99px; padding:5px 12px; font-size:14px; color:#17150F\"><span style=\"width:9px; height:9px; border-radius:50%; background:#3B82F6\"><\u002Fspan>Reçu<\u002Fspan><span style=\"color:#A5A093\">→<\u002Fspan><span style=\"display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #E8E5DE; border-radius:99px; padding:5px 12px; font-size:14px; color:#17150F\"><span style=\"width:9px; height:9px; border-radius:50%; background:#22C55E\"><\u002Fspan>Traité<\u002Fspan><span style=\"font-size:14px; color:#6A665C; margin-left:4px\">— aux touches 1 à 4.<\u002Fspan><\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Demandé<\u002Fstrong> = on attend quelque chose de quelqu'un, donc on peut relancer. <strong style=\"color:#17150F\">Reçu<\u002Fstrong> = les éléments sont en main, il faut passer à l'acte.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">C<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Ma journée<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Vous composez la liste<\u002Fstrong> (touche A ou bouton ☀), avec option « grouper par dossier ».<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Suggestions en quatre catégories :<\u002Fstrong> importantes ★, en retard, à échéance aujourd'hui, créées récemment.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Le soir,<\u002Fstrong> les tâches non traitées restent dans leur dossier ; la journée se recompose le matin.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">D<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Modèles<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Une liste de tâches type,<\u002Fstrong> sous-tâches comprises, réutilisable pour pré-remplir un dossier. Un modèle « Vente immobilière » est fourni.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Enregistrement :<\u002Fstrong> dossier ouvert → barre d'actions → « Modèle → Enregistrer comme modèle ». Seule la structure est reprise, ni statuts ni échéances.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Application :<\u002Fstrong> au choix d'un dossier vierge ou d'un modèle à la création ; ou « Modèle → Appliquer un modèle » dans un dossier existant, les tâches repartant du statut Créé.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Gestion<\u002Fstrong> dans Préférences → Modèles : renommer, supprimer, consulter le détail.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">E<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Mémos<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Des tâches légères<\u002Fstrong> créées dans Ma journée, sans dossier parent, avec échéance et observations si besoin.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Rattachables à un dossier,<\u002Fstrong> où elles deviennent une tâche à part entière.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Récurrence<\u002Fstrong> hebdomadaire, mensuelle ou personnalisée ; l'occurrence suivante naît quand vous cochez.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">F<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Importance &amp; échéances<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Étoile ★ :<\u002Fstrong> fond jaune partout, remontée en tête des suggestions.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Échéances sans calendrier :<\u002Fstrong> Aujourd'hui, Demain, Dans 1 semaine, Dans 1 mois. Le retard s'affiche en rouge.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Cohérence là aussi :<\u002Fstrong> une tâche ne peut pas échoir avant ses sous-tâches.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">G<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Rappels<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Par tâche ou par mémo :<\u002Fstrong> Dans 1 h, Demain 9 h, ou date et heure au choix.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Notification système<\u002Fstrong> même application fermée, tant que le navigateur tourne ; bandeau discret si Henri est ouvert devant vous.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Autorisation à donner une fois<\u002Fstrong> par appareil, appareils gérés dans les Préférences.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">H<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Export &amp; import<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Export JSON d'un dossier<\u002Fstrong> avec son état complet : tâches, sous-tâches, statuts, commentaires, échéances.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Import<\u002Fstrong> pour recréer une structure ou injecter des tâches dans un dossier existant. Pour réutiliser une trame, les Modèles sont plus directs ; l'export sert à archiver ou transmettre.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">I<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Mobile<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Ouverture directe sur Ma journée,<\u002Fstrong> grandes cartes tactiles.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Balayage horizontal :<\u002Fstrong> Dossiers → Tâches → Sous-tâches → Détail. Bouton 🔭 pour les suggestions, « + Nouveau mémo » pour capturer en déplacement.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; border-bottom:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:ui-monospace,monospace; font-size:12px; color:#FF3D00; display:block; margin-bottom:6px\">J<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px\">Installation &amp; prise en main<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Application installable<\u002Fstrong> sur Chrome et Edge, Android et iOS, sans magasin : démarrage plus rapide, plein écran, rappels plus fiables, mises à jour automatiques.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Visite guidée<\u002Fstrong> et pas à pas « créer une tâche » sur un dossier d'entraînement, relançables depuis l'Aide.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:0 48px 72px; max-width:760px\">\n    <div style=\"font-family:ui-monospace,monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#FF3D00; margin-bottom:20px\">Pour le rédacteur<\u002Fdiv>\n    <p style=\"font-size:18px; line-height:1.7; margin:0 0 18px; text-wrap:pretty\">Ce qui coûte, dans un dossier, ce n'est pas la rédaction. C'est de tenir en tête ce qui manque encore. Henri prend cette charge.<\u002Fp>\n    <p style=\"font-size:18px; line-height:1.7; color:#6A665C; margin:0; text-wrap:pretty\">Vous ouvrez le matin, la vue « Ma journée » vous montre ce qui dort depuis une semaine et ce qui tombe demain, et vous travaillez. Le soir, ce que vous n'avez pas fait est encore là, à sa place, dans le bon dossier — et pas sur un papier jaune décollé d'un écran.<\u002Fp>\n  <\u002Fsection>\n\n  <footer style=\"display:flex; justify-content:space-between; padding:24px 48px; font-size:13px; color:#A5A093; border-top:1px solid #E8E5DE\">\n    <span>© 2026 Office Notarial Tagot<\u002Fspan>\n    <a href=\"index.html#contact\" style=\"color:#A5A093\">Contact<\u002Fa>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n\n<\u002Fbody><\u002Fhtml>"
