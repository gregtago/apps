  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

fa437d4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8aa138c5-cd91-84bf-dd47-e067187772fc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"6d6eb888-7598-464c-afea-2ab2bbb744fc\"><\u002Fscript>\n<style>\nbody { margin:0; background:#F7F6F1; color:#17150F; font-family:'Instrument Sans',sans-serif; -webkit-font-smoothing:antialiased; }\na { color:#9E3327; text-decoration:none; }\na:hover { color:#7E2820; }\n::selection { background:#9E3327; color:#fff; }\n<\u002Fstyle>\n\n<style>\n/* --- Sous 760 px : téléphone et petites tablettes --------------------- */\n@media (max-width: 760px) {\n  .m-tete {\n    padding: 14px 20px !important;\n    flex-wrap: wrap !important;\n    gap: 4px 18px !important;\n    align-items: baseline !important;\n  }\n  .m-tete nav { gap: 16px !important; font-size: 13px !important; flex-wrap: wrap !important; }\n\n  .m-sec { padding-left: 20px !important; padding-right: 20px !important; }\n  .m-sec.m-hero { padding-top: 48px !important; gap: 28px !important; }\n\n  /* Les grandes signatures reprennent leur proportion au lieu d'une hauteur fixe. */\n  .m-sec h1 img {\n    height: auto !important;\n    max-width: 100% !important;\n    max-height: 92px !important;\n  }\n  .m-sec img { max-width: 100% !important; }\n  .m-sec figure > div { max-width: 100% !important; }\n\n  /* Toutes les grilles passent à une colonne. */\n  .m-grille { grid-template-columns: 1fr !important; }\n  .m-cartes > * { padding: 22px !important; gap: 26px !important; }\n\n  /* Les blocs de fonctionnalités : l'intitulé au-dessus du contenu. */\n  .m-fonc {\n    grid-template-columns: 1fr !important;\n    gap: 12px !important;\n    padding: 26px 0 !important;\n  }\n\n  .m-pied { padding: 20px !important; flex-wrap: wrap !important; gap: 6px 16px !important; }\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh; display:flex; flex-direction:column\">\n  <header class=\"m-tete\" style=\"display:flex; align-items:center; justify-content:space-between; padding:22px 48px; background:#17150F\">\n    <a href=\"index.html\" style=\"font-family:Arial,sans-serif; font-weight:500; font-size:22px; letter-spacing:0.01em; color:#fff\">Grégoire TAGOT&nbsp; &nbsp;|&nbsp; &nbsp;applications<\u002Fa>\n    <nav style=\"display:flex; gap:28px; font-size:14px\">\n      <a href=\"https://tagot.notaires.fr\" style=\"color:#fff; font-weight:700\">Notaire<\u002Fa>\n      <a href=\"index.html#apps\" style=\"color:#fff\">← Toutes les applications<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section class=\"m-sec m-hero\" style=\"padding:100px 48px 72px; max-width:1100px\">\n    <div style=\"font-family:'Instrument Sans',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.01em; color:#9E3327; margin-bottom:24px\">L’immeuble · renseignements et annexes<\u002Fdiv>\n    <h1 style=\"margin:0; display:flex; align-items:center; gap:20px\"><img src=\"62f7fc71-fe0f-4342-b535-5012fae70775\" alt=\"\" style=\"height:120px; display:block\"><span style=\"font-family:'Instrument Sans',sans-serif; font-weight:600; font-size:clamp(64px,10vw,104px); letter-spacing:-0.04em; line-height:1; color:#12355B\">pierre<span style=\"color:#D0A325\">.<\u002Fspan><\u002Fspan><\u002Fh1>\n    <p style=\"font-family:'Spectral',Georgia,serif; font-weight:600; font-size:clamp(26px,3.2vw,38px); line-height:1.25; max-width:760px; margin:28px 0 20px; text-wrap:balance\">À partir d’une adresse : les renseignements sur l’immeuble, et les pièces à annexer.<\u002Fp>\n    <p style=\"font-size:19px; line-height:1.6; color:#6A665C; max-width:680px; margin:0 0 36px; text-wrap:pretty\">Pour un seul immeuble, j’ouvrais le cadastre, le Géoportail de l’urbanisme, Géorisques, ERRIAL, le site de la Ville de Paris — et je recommençais au dossier suivant. Pierre le fait à ma place : je saisis une adresse ou des parcelles, il interroge les sources publiques, me montre ce qu’elles disent du terrain et réunit les pièces officielles à annexer à l’acte.<\u002Fp>\n    <a href=\"https://pierre.tagot.fr\" style=\"display:inline-block; background:#9E3327; color:#fff; padding:14px 28px; border-radius:4px; font-size:15px; font-weight:500\" style-hover=\"background:#7E2820; color:#fff\">Ouvrir pierre.tagot.fr<\u002Fa>\n  <\u002Fsection>\n\n  <section class=\"m-sec\" style=\"padding:0 48px 72px\">\n    <div style=\"font-family:'Instrument Sans',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.01em; color:#A5A093; margin-bottom:20px\">Ce que fait l’outil<\u002Fdiv>\n    <div class=\"m-grille m-cartes\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; max-width:1400px\">\n      <div style=\"background:#fff; border:1px solid #E5E3DB; border-radius:5px; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Une adresse, ou des parcelles<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Vous saisissez l’adresse, ou les références cadastrales — « BQ 10, BQ 11 ». Un clic sur la carte change de terrain, ajoute une parcelle ou en retire une.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E3DB; border-radius:5px; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">La désignation, prête à reprendre<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Commune, section, numéro, contenance : la phrase de désignation est rédigée, il reste à la copier dans l’acte.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E3DB; border-radius:5px; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">L’urbanisme du terrain<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Le document applicable et sa version, la zone et son règlement, les prescriptions, les servitudes d’utilité publique — et les points à vérifier auprès de la mairie : préemption, ZAD, ZAC.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E3DB; border-radius:5px; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Les risques, carte à l’appui<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Plans de prévention et dates de leurs arrêtés, catastrophes naturelles, bruit des aérodromes, termites, radon, pollution des sols. Pour chaque plan, la carte du zonage avec le terrain dessus.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E3DB; border-radius:5px; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">Les pièces à annexer<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Extrait du plan cadastral, état des risques, arrêtés préfectoraux, rapport de risques ; à Paris, la notice de renseignements d’urbanisme. Un fichier par pièce, numérotés, téléchargés ensemble.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #E5E3DB; border-radius:5px; padding:28px\"><div style=\"font-weight:600; font-size:15px; margin-bottom:8px\">L’annuaire des services compétents<\u002Fdiv><div style=\"font-size:14px; color:#6A665C; line-height:1.6\">Publicité foncière, enregistrement, cadastre, SIP et SIE ; mairie, préfecture, juridictions, chambre des notaires, SAFER.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"m-sec\" style=\"padding:0 48px 72px\">\n    <figure style=\"margin:0; max-width:1400px\">\n      <div style=\"aspect-ratio:1600/1025; border:1px solid #E8E5DE\"><image-slot id=\"pierre-1\" shape=\"rounded\" radius=\"4\" fit=\"cover\" src=\"0e37aebc-bbce-4a1e-8310-e25fb717a5a7\" placeholder=\"Capture d’écran — la fiche d’un terrain\"><\u002Fimage-slot><\u002Fdiv>\n      <figcaption style=\"font-size:13px; color:#A5A093; margin-top:8px\">La fiche d’un terrain : la carte et les pièces à annexer à gauche, la désignation cadastrale et l’urbanisme à droite.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section class=\"m-sec\" style=\"padding:0 48px 72px\">\n    <div style=\"font-family:'Instrument Sans',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.01em; color:#A5A093; margin-bottom:8px\">Fonctionnalités<\u002Fdiv>\n    <div style=\"max-width:1100px\">\n      <div class=\"m-fonc\" style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:'Instrument Sans',sans-serif; font-size:12.5px; font-weight:600; color:#9E3327; display:block; margin-bottom:6px\">A<\u002Fspan><div style=\"font-family:'Spectral',Georgia,serif; font-weight:600; font-size:22px\">Le terrain<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Par adresse ou par parcelles,<\u002Fstrong> jusqu’à trente parcelles d’un même tènement. L’adresse de la page décrit le terrain : elle se partage avec un collaborateur, qui retrouve la même fiche.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Trois fonds de carte :<\u002Fstrong> plan, photographie aérienne, cadastre.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">La désignation cadastrale,<\u002Fstrong> avec l’identifiant de chaque parcelle, sa contenance et la phrase à reprendre dans l’acte.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"m-fonc\" style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:'Instrument Sans',sans-serif; font-size:12.5px; font-weight:600; color:#9E3327; display:block; margin-bottom:6px\">B<\u002Fspan><div style=\"font-family:'Spectral',Georgia,serif; font-weight:600; font-size:22px\">Urbanisme<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Le zonage et le règlement de la zone,<\u002Fstrong> les pièces graphiques du document d’urbanisme, les prescriptions et les actes des servitudes, par lien vers le Géoportail de l’urbanisme.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Des points à vérifier,<\u002Fstrong> signalés ou non par les données publiées : ce que la mairie doit confirmer est signalé.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">À Paris,<\u002Fstrong> la notice de renseignements d’urbanisme de la Ville, une par parcelle. Ailleurs, la note se demande à la mairie.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"m-fonc\" style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:'Instrument Sans',sans-serif; font-size:12.5px; font-weight:600; color:#9E3327; display:block; margin-bottom:6px\">C<\u002Fspan><div style=\"font-family:'Spectral',Georgia,serif; font-weight:600; font-size:22px\">Risques<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Plans de prévention :<\u002Fstrong> la situation du terrain dans le zonage réglementaire de chaque plan, la carte, les dates et le texte des arrêtés d’approbation.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Vos constats.<\u002Fstrong> Pour chaque plan, pour le plan d’exposition au bruit et pour les termites, la fiche montre la carte et vous demande si le terrain est concerné. Vos réponses sont gardées dans le navigateur, terrain par terrain.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Pollution des sols :<\u002Fstrong> anciens sites industriels, sites pollués, secteurs d’information sur les sols, installations classées.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Paris :<\u002Fstrong> le zonage des plans d’inondation, d’anciennes carrières et de dissolution du gypse.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"m-fonc\" style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:'Instrument Sans',sans-serif; font-size:12.5px; font-weight:600; color:#9E3327; display:block; margin-bottom:6px\">D<\u002Fspan><div style=\"font-family:'Spectral',Georgia,serif; font-weight:600; font-size:22px\">Les pièces<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Les pièces officielles, sans retouche :<\u002Fstrong> extrait du plan cadastral avec son cartouche, état des risques délivré par ERRIAL, arrêtés des plans de prévention, rapport de risques de Géorisques.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">L’imprimé officiel de l’état des risques,<\u002Fstrong> rempli d’après vos constats et les réponses du vendeur ; il reste modifiable.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Un rapport d’analyse,<\u002Fstrong> établi par Pierre : ce qu’il relève sur le terrain, la carte de chaque plan, vos constats et les réponses du vendeur.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Un envoi groupé :<\u002Fstrong> les pièces cochées arrivent dans une archive, numérotées — « 01 - Extrait du plan cadastral.pdf ».<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"m-fonc\" style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:'Instrument Sans',sans-serif; font-size:12.5px; font-weight:600; color:#9E3327; display:block; margin-bottom:6px\">E<\u002Fspan><div style=\"font-family:'Spectral',Georgia,serif; font-weight:600; font-size:22px\">Le parcours<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Cinq étapes numérotées,<\u002Fstrong> rappelées dans un panneau avec leur avancement : vérifier le terrain, lire l’urbanisme, regarder les cartes des risques, interroger le vendeur, télécharger les pièces.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Les pièces viennent en dernier,<\u002Fstrong> parce que l’état des risques et le rapport reprennent vos constats ; la dernière étape signale ce qui reste à renseigner.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"m-fonc\" style=\"display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:24px 48px; border-top:1px solid #E8E5DE; border-bottom:1px solid #E8E5DE; padding:32px 0\">\n        <div><span style=\"font-family:'Instrument Sans',sans-serif; font-size:12.5px; font-weight:600; color:#9E3327; display:block; margin-bottom:6px\">F<\u002Fspan><div style=\"font-family:'Spectral',Georgia,serif; font-weight:600; font-size:22px\">Pour information<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; font-size:15px; line-height:1.6; color:#3E3B33\">\n          <div><strong style=\"color:#17150F\">Les ventes publiées<\u002Fstrong> sur la parcelle et alentour, et les diagnostics de performance énergétique enregistrés à l’adresse.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">L’annuaire :<\u002Fstrong> services fiscaux compétents, mairie, préfecture, juridictions, chambre des notaires, SAFER, caisses de retraite.<\u002Fdiv>\n          <div><strong style=\"color:#17150F\">Les sources :<\u002Fstrong> IGN, DGFiP, Géoportail de l’urbanisme, Géorisques, Cerema, ADEME, DGAC, Ville de Paris, Service-Public. Toutes ouvertes.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"m-sec\" style=\"padding:0 48px 72px; max-width:760px\">\n    <div style=\"font-family:'Instrument Sans',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.01em; color:#9E3327; margin-bottom:20px\">À savoir<\u002Fdiv>\n    <p style=\"font-size:18px; line-height:1.7; margin:0; text-wrap:pretty\">Ce que Pierre affiche est informatif : il ne remplace ni le certificat d’urbanisme, ni l’état des risques. Les pièces qu’il remet sont celles des organismes officiels, telles quelles. Pas de compte à créer, rien n’est conservé.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"m-sec\" style=\"padding:0 48px 72px; max-width:760px\">\n    <div style=\"font-family:'Instrument Sans',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.01em; color:#9E3327; margin-bottom:20px\">Pour le rédacteur<\u002Fdiv>\n    <p style=\"font-size:18px; line-height:1.7; margin:0 0 18px; text-wrap:pretty\">Le jour où j’ouvre un dossier de vente, je tape l’adresse. Quelques instants plus tard, j’ai la désignation à reprendre dans l’acte, le zonage et son règlement, les plans de prévention qui touchent la commune, et l’adresse du service de publicité foncière.<\u002Fp>\n    <p style=\"font-size:18px; line-height:1.7; color:#6A665C; margin:0; text-wrap:pretty\">Et le jour de la signature, les annexes sont déjà là : numérotées, dans l’ordre, chacune telle que l’organisme la délivre.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"m-sec\" style=\"padding:0 48px 96px\">\n    <figure style=\"margin:0; max-width:900px\">\n      <div style=\"aspect-ratio:1600/1025; border:1px solid #E8E5DE\"><image-slot id=\"pierre-2\" shape=\"rounded\" radius=\"4\" fit=\"cover\" src=\"71bf2211-f9f6-4db0-87d2-6064d31b7515\" placeholder=\"Capture d’écran — l’accueil\"><\u002Fimage-slot><\u002Fdiv>\n      <figcaption style=\"font-size:13px; color:#A5A093; margin-top:8px\">L’accueil : une adresse, ou des parcelles.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <footer class=\"m-pied\" style=\"display:flex; justify-content:space-between; padding:24px 48px; font-size:13px; color:#A5A093; border-top:1px solid #E8E5DE\">\n    <span>© 2026 Office Notarial Tagot<\u002Fspan>\n    <a href=\"index.html#contact\" style=\"color:#A5A093\">Contact<\u002Fa>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n\n<\u002Fbody><\u002Fhtml>"
